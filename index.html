    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Configuración de fuentes personalizadas */
        .font-script {
            font-family: 'Great Vibes', cursive;
        }
        .font-serif-elegant {
            font-family: 'Playfair Display', serif;
        }
        .font-sans-clean {
            font-family: 'Montserrat', sans-serif;
        }

        /* Fondo degradado cálido y romántico */
        body {
            background: radial-gradient(circle at center, #fff5f7 0%, #ffe3e8 45%, #f9cbd6 100%);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animación suave de flotación/respiración para el ramo de flores */
        @keyframes gentleSway {
            0%, 100% {
                transform: rotate(-1.5deg) translateY(0px);
            }
            50% {
                transform: rotate(1.5deg) translateY(-6px);
            }
        }

        .bouquet-container {
            animation: gentleSway 6s ease-in-out infinite;
            transform-origin: bottom center;
        }

        /* Animación individual sutil para las flores */
        @keyframes bloomPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
            }
        }

        .flower-head {
            animation: bloomPulse 4s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .flower-delay-1 { animation-delay: 0.5s; }
        .flower-delay-2 { animation-delay: 1.2s; }
        .flower-delay-3 { animation-delay: 2.0s; }

        /* Animación de caída de pétalos de fondo */
        @keyframes fallAndSway {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.85;
            }
            50% {
                transform: translateY(45vh) translateX(35px) rotate(180deg);
            }
            90% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(105vh) translateX(-25px) rotate(360deg);
                opacity: 0;
            }
        }

        .floating-petal {
            position: fixed;
            top: -50px;
            pointer-events: none;
            z-index: 1;
            animation: fallAndSway linear infinite;
        }

        /* Animación de explosión de corazones al hacer clic */
        @keyframes floatUpAndFade {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-250px) scale(1.3) rotate(var(--rot));
                opacity: 0;
            }
        }

        .burst-particle {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            animation: floatUpAndFade 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* Efecto de brillo sutil en el texto principal */
        .text-glow {
            text-shadow: 0 4px 15px rgba(225, 29, 72, 0.2);
        }

        /* Estilo personalizado para el botón romántico */
        .love-btn {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 50%, #be123c 100%);
            box-shadow: 0 10px 25px -5px rgba(225, 29, 72, 0.45), 0 4px 10px -2px rgba(225, 29, 72, 0.3);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .love-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 30px -5px rgba(225, 29, 72, 0.6), 0 6px 15px -2px rgba(225, 29, 72, 0.4);
        }

        .love-btn:active {
            transform: translateY(1px) scale(0.97);
        }
    </style>
</head>
